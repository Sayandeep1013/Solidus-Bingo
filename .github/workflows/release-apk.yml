# .github/workflows/release-apk.yml
#
# Builds a direct-install Android APK via EAS (using the `apk-release`
# profile from eas.json — internal distribution, no test-login, real
# Supabase backend baked in) and publishes it as a GitHub Release asset.
#
# Triggers:
#   - Manual only: Actions tab -> Release APK -> Run workflow
#
# Deliberately NOT triggered by v* tags. build-apk-github.yml owns those, and
# when both were tag-triggered (v1.0.1) they ran against the same tag: two APKs
# racing to attach themselves to one GitHub Release, and an EAS build burning
# queue time and quota for an artifact nobody wanted. This is the fallback for
# when the GitHub-native Gradle build is the thing that's broken, so it has to
# be started deliberately.
#
# Requires a repo secret named EXPO_TOKEN (Settings -> Secrets and
# variables -> Actions -> New repository secret). Generate one at
# https://expo.dev/accounts/<account>/settings/access-tokens if you don't
# already have one — this lets EAS build non-interactively in CI without a
# login prompt.

name: Release APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile to use'
        required: false
        default: 'apk-release'

jobs:
  # Same gate as build-apk-github.yml. This path ships to real players too, so
  # being the emergency fallback doesn't earn it the right to skip the checks.
  verify:
    name: Verify (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src --ext .ts,.tsx --max-warnings 0

      - name: Unit tests + PBT
        run: npm run test:unit

      - name: Component tests
        run: npm run test:component

  build-and-release:
    name: Build APK and publish release
    needs: verify
    runs-on: ubuntu-latest
    # Without this the default GITHUB_TOKEN is read-only and the final step dies
    # with "Resource not accessible by integration" — which is exactly how the
    # v1.0.1 EAS run failed, after spending a full cloud build to get there.
    # build-apk-github.yml has always had it; this one never did.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK on EAS
        run: |
          eas build \
            --platform android \
            --profile "${{ github.event.inputs.profile || 'apk-release' }}" \
            --non-interactive --wait --json > build-output.json
          cat build-output.json

      - name: Extract build info
        id: build
        run: |
          URL=$(jq -r '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl // empty' build-output.json)
          if [ -z "$URL" ]; then
            echo "ERROR: could not find a build artifact URL in EAS output — build may have failed."
            exit 1
          fi
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "download_url=$URL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: curl -L "${{ steps.build.outputs.download_url }}" -o solidus-bingo.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: "Solidus Bingo v${{ steps.build.outputs.version }} (build ${{ github.run_number }})"
          files: solidus-bingo.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
