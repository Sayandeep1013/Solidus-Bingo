# .github/workflows/test.yml
#
# Solidus Bingo CI Pipeline
# Runs on every push to main, develop, or a feature/* branch, and on PRs
# targeting main or develop.
#
# Job order (spec bingo-testing Req 10.2):
#   1. lint         — tsc + ESLint
#   2. test:unit    — unit tests + PBT (no Supabase required)
#   3. test:component — React Native Testing Library
#   4. secret-scan  — exported-bundle secret leak check (standalone — see below)
#   5. test:integration — Edge Function + schema tests (requires supabase start)
#   6. coverage     — threshold enforcement + artifact upload
#
# secret-scan runs `expo export`, a single-threaded Metro bundle that's CPU-
# heavy enough to starve the Supabase Postgres/Kong containers of CPU on a
# standard 2-vCPU runner — it used to run *inside* the integration-tests job
# right before the test suite, and that contention made Supabase's API
# intermittently fail its ~10s reachability check immediately after, with no
# real reachability problem. It doesn't need Supabase running at all, so it's
# its own job now — removes the contention and runs in parallel besides.
#
# Spec refs: bingo-testing §Req 10, §Req 11

name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

env:
  # Increase PBT runs in CI for more thorough property checking
  FC_NUM_RUNS: 200
  # Supabase local URL for integration tests. ANON_KEY/SERVICE_ROLE_KEY are
  # NOT secrets here — they're captured fresh from each run's own local
  # `supabase start` instance (see test-integration job) rather than stored
  # as repo secrets, so there's nothing to configure by hand.
  SUPABASE_URL: http://localhost:54321

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Lint — TypeScript + ESLint
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src --ext .ts,.tsx --max-warnings 0

      # Spec bingo-testing Req 11.11 — verify .env.local is gitignored
      - name: Verify .env.local is gitignored
        run: |
          if git check-ignore -q .env.local; then
            echo ".env.local is correctly gitignored"
          else
            echo "ERROR: .env.local is NOT gitignored! Fix .gitignore immediately."
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Unit tests + PBT
  # ─────────────────────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests + PBT
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
        env:
          FC_NUM_RUNS: ${{ env.FC_NUM_RUNS }}

      # Spec bingo-testing Req 10.8 — log PBT seed on failure
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Component tests (React Native Testing Library)
  # ─────────────────────────────────────────────────────────────────────────
  test-component:
    name: Component Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run component tests
        run: npm run test:component

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4: Secret leak scan — standalone, no Supabase needed (see header note)
  # ─────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Leak Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Spec bingo-testing Req 11 — scans the actual exported bundle files,
      # not the export command's log output — the JS bundle is written to
      # disk, never printed to stdout, so grepping the command's output
      # alone would never catch anything.
      - name: Secret leak scan
        run: |
          npx expo export --platform android --output-dir /tmp/export-scan
          if grep -raoE "service_role|client_secret|SUPABASE_SERVICE_ROLE|GOOGLE_CLIENT_SECRET" /tmp/export-scan/_expo/static/js/android/*.hbc; then
            echo "SECRET LEAK DETECTED in exported bundle — aborting"
            exit 1
          fi
          echo "Secret scan passed"
          rm -rf /tmp/export-scan
        continue-on-error: false

  # ─────────────────────────────────────────────────────────────────────────
  # Job 5: Integration tests (requires Supabase)
  # ─────────────────────────────────────────────────────────────────────────
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-unit, test-component]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned instead of "latest" — resolving "latest" calls GitHub's
          # release-list API unauthenticated, which hit a rate limit and
          # failed the whole job (command not found, exit 127) the first
          # time this pipeline actually ran. A pinned version fetches one
          # known release directly, no listing call needed.
          version: 2.113.0

      # Cache Supabase CLI between runs (spec Req 10.4)
      - name: Cache Supabase
        uses: actions/cache@v4
        with:
          path: ~/.supabase
          key: supabase-${{ hashFiles('supabase/migrations/**') }}

      - name: Start Supabase
        run: supabase start
        timeout-minutes: 3
        # `supabase start` itself blocks until every container (including the
        # API gateway) reports healthy before returning, so a separate polling
        # health-check step is redundant here — if this step exits 0, the
        # stack is genuinely ready.

      # Every `supabase start` mints its own local ANON_KEY/SERVICE_ROLE_KEY
      # (derived from config.toml's fixed local JWT secret) — capture them
      # here rather than relying on repo secrets that would need manual setup.
      - name: Export local Supabase credentials
        run: |
          ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY')
          SERVICE_ROLE_KEY=$(supabase status -o json | jq -r '.SERVICE_ROLE_KEY')
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      # No separate "apply migrations" step: `supabase start` above already
      # applies every file in supabase/migrations/ while bootstrapping the
      # fresh local database. `supabase db push` (without --linked/--local)
      # targets a *remote* linked project by default — this workflow never
      # runs `supabase link`, so that call had nothing valid to push to and
      # failed outright, on top of being redundant with `start`.

      - name: Run integration tests
        run: npm run test:integration

      - name: Stop Supabase
        if: always()
        run: supabase stop

  # ─────────────────────────────────────────────────────────────────────────
  # Job 6: Coverage — threshold enforcement
  # ─────────────────────────────────────────────────────────────────────────
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [test-unit, test-component]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run coverage
        run: npm run test:coverage
        env:
          FC_NUM_RUNS: ${{ env.FC_NUM_RUNS }}

      # Spec Req 10.5 — upload Coverage_Report as CI artifact
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      # Spec Req 10.6 — JUnit XML for per-test status
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: junit.xml
